<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UNG-CAD 3D</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,-apple-system,sans-serif;background:#2c4194;color:#fff}body{overflow:hidden}.app{display:grid;grid-template-columns:210px 1fr 220px;height:100vh}.left,.right{background:#30499b;padding:10px;overflow:auto;border-color:rgba(255,255,255,.3);border-style:solid}.left{border-width:0 1px 0 0}.right{border-width:0 0 0 1px}.viewport{position:relative;min-width:0;background:#2f469a}.brand{font-size:19px;font-weight:800;margin:4px 0 10px}.home{display:block;text-align:center;background:#fff;color:#28408b;text-decoration:none;padding:5px;margin-bottom:6px}.left button,.right button,.left input,.left select,.right input{width:100%;height:27px;margin:2px 0;border:1px solid #c7cee5;background:#fff;color:#2b397a;padding:3px 6px;font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:3px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.section{font-weight:700;font-size:13px;margin:8px 0 4px}.tiny{font-size:10px;color:#d9e0ff}.obj{padding:5px;border-bottom:1px solid rgba(255,255,255,.25);font-size:12px;cursor:pointer}.obj.sel{background:rgba(87,219,237,.28)}#viewport canvas{display:block}.status{font-size:10px;white-space:pre-wrap;min-height:20px;margin-top:4px;color:#dce9ff}#loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,36,96,.68);z-index:5;font-weight:bold}input[type=file]{height:auto;padding:2px}.hidden{display:none!important}@media(max-width:760px){body{overflow:auto}.app{display:flex;flex-direction:column;height:auto;min-height:100vh}.viewport{order:1;height:58vh;min-height:420px;position:relative}.left{order:2;border:0;border-top:1px solid rgba(255,255,255,.25)}.right{order:3;border:0;border-top:1px solid rgba(255,255,255,.25)}.left button,.right button,.left input,.right input{min-height:38px;font-size:14px}.brand{font-size:21px}.section{font-size:15px}}
</style></head><body><div class="app"><aside class="left"><div class="brand">UNG-CAD 3D</div><a class="home" href="/">← Home</a><input id="scene-name" value="Untitled scene"><input id="primitive-type" class="hidden" value="cube"><div class="row3"><button type="button" onclick="setPrimitive('cube')">Cube</button><button type="button" onclick="setPrimitive('sphere')">Sphere</button><button type="button" onclick="setPrimitive('cylinder')">Cylinder</button></div><div class="section">Size X/Y/Z</div><div id="cube-dims"><input id="cube-w" type="number" value="20" step="1"><input id="cube-h" type="number" value="20" step="1"><input id="cube-d" type="number" value="20" step="1"></div><div id="sphere-dims" class="hidden"><input id="sphere-r" type="number" value="10" step="1"></div><div id="cylinder-dims" class="hidden"><input id="cyl-r" type="number" value="10" step="1"><input id="cyl-h" type="number" value="20" step="1"></div><button id="add-btn" class="hidden">Add</button><div class="row"><button data-op="union" disabled>Union</button><button data-op="subtract" disabled>Subtract</button></div><button data-op="intersect" disabled>Intersect</button><button id="duplicate-btn" disabled>Duplicate</button><button id="delete-btn" disabled>Delete</button><div class="row"><button id="undo-btn" disabled>Undo</button><button id="redo-btn" disabled>Redo</button></div><button id="export-btn">Export STL</button><input id="import-file" type="file" accept=".stl"><button id="save-btn">Save</button><div id="saved-list"></div><div id="status" class="status"></div></aside><main id="viewport" class="viewport"><div id="loading">Computing…</div></main><aside class="right"><div class="section">Objects</div><div id="object-list"></div><div class="section">Move selected</div><input id="pos-x" type="number" value="0" step="1" disabled><input id="pos-y" type="number" value="0" step="1" disabled><input id="pos-z" type="number" value="0" step="1" disabled><button id="move-btn" disabled>Move</button><input id="rename-input" disabled><button type="button" onclick="document.getElementById('rename-input').dispatchEvent(new Event('change'))">Rename</button><button id="wireframe-btn">Toggle wireframe</button><button type="button" onclick="toggleSelectedVisibility()">Toggle visibility</button><div class="section">Camera</div><div class="row"><button data-view="iso">Iso</button><button data-view="front">Front</button></div><div class="row"><button data-view="top">Top</button><button data-view="side">Side</button></div></aside></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script><script src="/static/csg-engine.js"></script><script src="/static/history-stack.js"></script><script src="/static/viewer.js"></script><script>function setPrimitive(type){const s=document.getElementById('primitive-type');s.value=type;s.dispatchEvent(new Event('change'));document.getElementById('add-btn').click()}function toggleSelectedVisibility(){const sel=document.querySelector('#object-list .sel');if(sel){const spans=sel.querySelectorAll('span');if(spans[1])spans[1].click()}}</script></body></html>
