<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UNG-CAD-3D</title><style>html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0}body{display:flex}#panel{width:280px;padding:14px;box-sizing:border-box;background:#111827;overflow-y:auto;border-right:1px solid #334155}#viewport{flex:1;min-width:0;position:relative}h2{margin:0 0 4px;font-size:18px}h3{margin:16px 0 7px;font-size:11px;text-transform:uppercase;color:#94a3b8;letter-spacing:.08em}.field{margin-bottom:7px}.field label{display:block;font-size:10px;color:#94a3b8;margin-bottom:3px}.field input,.field select{width:100%;box-sizing:border-box;padding:8px;border-radius:7px;border:1px solid #475569;background:#0f172a;color:#e2e8f0}.row{display:flex;gap:6px}.row>*{flex:1}button{width:100%;padding:9px;margin:3px 0;border:0;border-radius:8px;background:#334155;color:#fff;font-weight:600}button.primary{background:#2563eb}button.danger{background:#7f1d1d}button:disabled{opacity:.4}.obj{display:flex;justify-content:space-between;gap:8px;padding:7px;border-radius:7px;cursor:pointer}.obj.sel{background:#334155}.muted{font-size:11px;color:#94a3b8}.status{font-size:11px;color:#93c5fd;min-height:18px;white-space:pre-wrap;margin-top:8px}#loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.72);z-index:5;font-weight:700}@media(max-width:700px){body{display:block;overflow:auto}#panel{width:100%;height:auto;border-right:0;border-bottom:1px solid #334155}#viewport{height:58vh;min-height:420px}button{min-height:44px}.field input,.field select{min-height:44px}}</style></head><body><aside id="panel"><h2>UNG-CAD-3D</h2><div class="muted">Solid modeling • CSG booleans • STL import/export • save/load</div><h3>Add primitive</h3><div class="field"><label>Type</label><select id="primitive-type"><option value="cube">Cube</option><option value="sphere">Sphere</option><option value="cylinder">Cylinder</option></select></div><div class="row"><div class="field"><label>Size / Radius</label><input id="size" type="number" value="2" step=".5"></div><div class="field"><label>Height</label><input id="height" type="number" value="3" step=".5"></div></div><button id="add-btn" class="primary">+ Add shape</button><h3>Objects</h3><div id="object-list"></div><h3>Selected object</h3><div class="field"><label>Name</label><input id="rename-input" disabled></div><div class="row"><div class="field"><label>X</label><input id="pos-x" type="number" step=".5" disabled></div><div class="field"><label>Y</label><input id="pos-y" type="number" step=".5" disabled></div><div class="field"><label>Z</label><input id="pos-z" type="number" step=".5" disabled></div></div><button id="move-btn" disabled>Move to position</button><div class="row"><button id="duplicate-btn" disabled>Duplicate</button><button id="delete-btn" class="danger" disabled>Delete</button></div><h3>Boolean — select 2</h3><button data-op="union" disabled>Union</button><button data-op="subtract" disabled>Subtract</button><button data-op="intersect" disabled>Intersect</button><h3>View</h3><div class="row"><button data-view="iso">Iso</button><button data-view="front">Front</button><button data-view="top">Top</button><button data-view="side">Side</button></div><button id="wireframe-btn">Toggle wireframe</button><h3>Save / Load</h3><div class="field"><label>Scene name</label><input id="scene-name" value="Untitled scene"></div><button id="save-btn" class="primary">Save scene</button><div id="saved-list"></div><h3>STL</h3><button id="export-btn">Export STL</button><div class="field"><label>Import STL</label><input id="import-file" type="file" accept=".stl"></div><div id="status" class="status"></div></aside><main id="viewport"><div id="loading">Computing…</div></main><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script><script src="/static/csg-engine.js"></script><script src="/static/viewer.js"></script></body></html>
