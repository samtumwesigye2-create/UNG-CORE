<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNG-CAD Manufacturing</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#172c85,#2945ad);font-family:Arial;color:#fff;min-height:100vh}.top{padding:18px 24px;border-bottom:1px solid #7288dc;display:flex;gap:10px}.top button{background:#eef3ff;color:#243a88;border:0;padding:8px 18px}.wrap{padding:28px;max-width:1100px;margin:auto}.box{background:#2943a5;border:1px solid #7188dd;border-radius:8px;padding:22px}h1{margin:0 0 18px;font-size:25px}.meta,.status{font-size:13px;color:#dce4ff;white-space:pre-line}.notice{margin:16px 0;padding:14px;background:#1e347f;border-left:4px solid #55d7ff}.controls{display:grid;grid-template-columns:1fr 180px 150px;gap:10px;align-items:end;margin:15px 0}.field label{display:block;font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;border:0;border-radius:5px}.btn{padding:11px 14px;border:0;border-radius:5px;background:#55c9ef;color:#12327f;font-weight:bold}.btn:disabled{opacity:.45}.part{display:grid;grid-template-columns:1fr 150px 120px;gap:8px;align-items:center;border-top:1px solid #6078ce;padding:10px 0;font-size:12px}.tag{padding:7px;border-radius:5px;text-align:center;background:#8a5b16}.ready{background:#16835d}.link{color:#fff;text-decoration:underline}.small{font-size:11px;color:#c8d4ff}.machine{margin-top:20px;padding:16px;background:#203a91;border-radius:6px}
</style></head>
<body><div class="top"><button onclick="location.href='/studio.html'">Home</button><button onclick="location.href='/viewer.html'">3D</button></div>
<div class="wrap"><div class="box"><h1>UNG-CAD Manufacturing</h1>
<input id="pkg" type="file" accept=".zip,.stl,.3mf,.gcode,.gx">
<div id="meta" class="meta">Load a DRACO Gen-1 package.</div>
<div class="notice"><b>Real manufacturing engine</b><span id="engine">Server-side STL slicing is available. No simulated print actions.</span></div>
<div class="controls">
<div class="field"><label>Printable part</label><select id="part" disabled><option>Select package first</option></select></div>
<div class="field"><label>Layer height (mm)</label><input id="layer" value="0.20" type="number" min="0.08" max="0.40" step="0.02"></div>
<button class="btn" id="slice" disabled>Slice for AD5M</button>
</div>
<div id="parts"></div>
<div class="machine"><b>AD5M printer bridge</b><div class="small">Enter the printer ID shown on the printer, pair once, then transmit a generated machine file through the local bridge.</div>
<div class="controls">
<div class="field"><label>Printer ID</label><input id="printer" value="SNMTUF9100669"></div>
<button class="btn" id="pair">Pair printer</button><button class="btn" id="send" disabled>Send sliced file</button>
</div><div id="status" class="status"></div></div>
</div></div>
<script>
const f=document.getElementById('pkg'),meta=document.getElementById('meta'),parts=document.getElementById('parts'),status=document.getElementById('status'),part=document.getElementById('part'),sliceBtn=document.getElementById('slice'),sendBtn=document.getElementById('send');
let selectedFile=null,lastMachineUrl=null,paired=false;
f.onchange=async()=>{if(!f.files[0])return;selectedFile=f.files[0];parts.innerHTML='';part.innerHTML='';status.textContent='Inspecting actual package…';const d=new FormData();d.append('file',selectedFile);
try{const r=await fetch('/api/manufacturing/inspect',{method:'POST',body:d}),j=await r.json();if(!r.ok)throw Error(j.detail||'Inspection failed');meta.textContent=selectedFile.name+' — '+j.part_count+' printable parts detected (assembly reference excluded)';
j.parts.forEach((n,i)=>{const o=document.createElement('option');o.value=n;o.textContent=(i+1)+'. '+n;part.appendChild(o);const row=document.createElement('div');row.className='part';const name=document.createElement('span');name.textContent=(i+1)+'. '+n;const tag=document.createElement('span');tag.className='tag';tag.textContent='STL — SLICE';const b=document.createElement('button');b.className='btn';b.textContent='Select';b.onclick=()=>{part.value=n;sliceBtn.disabled=false};row.append(name,tag,b);parts.appendChild(row)});part.disabled=false;sliceBtn.disabled=false;status.textContent='Package inspection complete. Select a part and click Slice for AD5M.'}catch(e){status.textContent='FAILED — '+e.message}};
part.onchange=()=>sliceBtn.disabled=!selectedFile||!part.value;
sliceBtn.onclick=async()=>{if(!selectedFile||!part.value)return;sliceBtn.disabled=true;sendBtn.disabled=true;status.textContent='Slicing real STL geometry…';const d=new FormData();d.append('file',selectedFile);d.append('selected',part.value);d.append('layer_height',document.getElementById('layer').value);
try{const r=await fetch('/api/manufacturing/slice',{method:'POST',body:d}),j=await r.json();if(!r.ok)throw Error(j.detail||'Slicing failed');lastMachineUrl=j.download;sendBtn.disabled=false;status.textContent='SLICE COMPLETE — '+j.stats.layers+' layers, '+j.stats.height_mm+' mm height, '+j.stats.size_xy_mm.join(' × ')+' mm XY.\nMachine file: '+j.machine_file+'\n';const a=document.createElement('a');a.className='link';a.href=j.download;a.download=j.machine_file;a.textContent='Download AD5M G-code';status.appendChild(a)}catch(e){status.textContent='SLICE FAILED — '+e.message}finally{sliceBtn.disabled=false}};
document.getElementById('pair').onclick=async()=>{status.textContent='Pairing with local AD5M bridge…';try{const r=await fetch('http://127.0.0.1:8765/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({printer_id:document.getElementById('printer').value.trim()})});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'Pairing failed');paired=true;status.textContent='PRINTER PAIRED — '+j.printer.name+' / '+j.printer.serial+' / '+j.printer.ip;sendBtn.disabled=!lastMachineUrl}catch(e){status.textContent='PAIR FAILED — '+e.message}};
sendBtn.onclick=async()=>{if(!lastMachineUrl||!paired)return;sendBtn.disabled=true;status.textContent='Sending machine file to local AD5M bridge…';try{const blob=await fetch(lastMachineUrl).then(r=>r.blob());const name=lastMachineUrl.split('/').pop();const r=await fetch('http://127.0.0.1:8765/print',{method:'POST',headers:{'X-Filename':name,'X-Level':'true'},body:await blob.arrayBuffer()});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'Printer rejected job');status.textContent='PRINT JOB ACCEPTED — '+j.file+'\nThe AD5M bridge reported the job started.'}catch(e){status.textContent='TRANSMISSION FAILED — '+e.message}finally{sendBtn.disabled=!paired||!lastMachineUrl}};
</script></body></html>
