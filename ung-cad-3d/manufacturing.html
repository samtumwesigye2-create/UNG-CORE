<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNG-CAD Manufacturing</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#172c85,#2945ad);font-family:Arial;color:#fff;min-height:100vh}.top{padding:18px 24px;border-bottom:1px solid #7288dc;display:flex;gap:10px}.top button{background:#eef3ff;color:#243a88;border:0;padding:8px 18px}.wrap{padding:28px;max-width:1100px;margin:auto}.box{background:#2943a5;border:1px solid #7188dd;border-radius:8px;padding:22px;box-shadow:0 12px 30px #0a164c55}h1{margin:0 0 18px;font-size:25px}input{margin:12px 0}.meta{font-size:12px;color:#dce4ff}.part{display:grid;grid-template-columns:1fr 120px 90px;gap:8px;align-items:center;border-top:1px solid #6078ce;padding:9px 0;font-size:12px}.part button,.print{border:0;border-radius:5px;background:#62dbe7;color:#fff;font-weight:bold;padding:8px}.print{background:#57a8ef}.status{margin-top:14px;font-size:12px;color:#dffcff}</style></head><body><div class="top"><button onclick="location.href='/studio.html'">Home</button><button onclick="location.href='/viewer.html'">3D</button></div><div class="wrap"><div class="box"><h1>UNG-CAD Manufacturing</h1><input id="pkg" type="file" accept=".zip,.stl,.3mf,.gcode,.gx"><div id="meta" class="meta">Load a UNG-CAD project package.</div><h3>Printable parts</h3><div id="parts"></div><div id="status" class="status"></div></div></div><script>
const f=document.getElementById('pkg'),meta=document.getElementById('meta'),parts=document.getElementById('parts'),status=document.getElementById('status');f.onchange=async()=>{if(!f.files[0])return;const file=f.files[0],d=new FormData();d.append('file',file);meta.textContent=file.name+' — '+(file.size/1024).toFixed(1)+' KB';parts.innerHTML='';status.textContent='Reading package…';try{const r=await fetch('/api/manufacturing/inspect',{method:'POST',body:d}),j=await r.json();if(!r.ok)throw Error(j.detail||'Package failed');meta.textContent=file.name+'\nPackage indexed: '+j.part_count+' printable parts detected.';j.parts.forEach((n,i)=>{const row=document.createElement('div');row.className='part';row.innerHTML='<span>'+(i+1)+'. '+n+'</span><button class="prep">Prepare to Print</button><button class="open">Open in 3D</button>';row.querySelector('.open').onclick=()=>location.href='/viewer.html';row.querySelector('.prep').onclick=()=>{status.textContent=/\.(gcode|gx|3mf)$/i.test(n)?'Machine-ready file selected: '+n:'Geometry selected: '+n+' — slicing is required before transmission.'};parts.appendChild(row)});status.textContent='Package ready.'}catch(e){status.textContent='FAILED — '+e.message}}</script></body></html>
