<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNG-CAD Manufacturing</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#172c85,#2945ad);font-family:Arial;color:#fff;min-height:100vh}.top{padding:18px 24px;border-bottom:1px solid #7288dc;display:flex;gap:10px}.top button{background:#eef3ff;color:#243a88;border:0;padding:8px 18px}.wrap{padding:28px;max-width:1100px;margin:auto}.box{background:#2943a5;border:1px solid #7188dd;border-radius:8px;padding:22px}h1{margin:0 0 18px;font-size:25px}.meta,.status{font-size:13px;color:#dce4ff;white-space:pre-line}.part{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;border-top:1px solid #6078ce;padding:10px 0;font-size:12px}.tag{padding:7px;border-radius:5px;text-align:center;background:#203681}.ready{background:#16835d}.blocked{background:#8a5b16}.notice{margin:16px 0;padding:14px;background:#1e347f;border-left:4px solid #f4c95d}.notice b{display:block;margin-bottom:5px}input{margin:12px 0}</style></head><body><div class="top"><button onclick="location.href='/studio.html'">Home</button><button onclick="location.href='/viewer.html'">3D</button></div><div class="wrap"><div class="box"><h1>UNG-CAD Manufacturing</h1><input id="pkg" type="file" accept=".zip,.stl,.3mf,.gcode,.gx"><div id="meta" class="meta">Load a manufacturing package.</div><div class="notice"><b>Real manufacturing status</b><span id="engine">Checking package…</span></div><h3>Package contents</h3><div id="parts"></div><div id="status" class="status"></div></div></div><script>
const f=document.getElementById('pkg'),meta=document.getElementById('meta'),parts=document.getElementById('parts'),status=document.getElementById('status'),engine=document.getElementById('engine');
engine.textContent='STL/mesh slicing engine is not installed on the production server. Geometry can be validated/indexed here, but UNG-CAD will not pretend an STL is prepared for the printer.';
f.onchange=async()=>{if(!f.files[0])return;const file=f.files[0],d=new FormData();d.append('file',file);parts.innerHTML='';status.textContent='Inspecting actual package…';try{const r=await fetch('/api/manufacturing/inspect',{method:'POST',body:d}),j=await r.json();if(!r.ok)throw Error(j.detail||'Package failed');meta.textContent=file.name+' — '+j.part_count+' manufacturing files detected';let machine=0,geometry=0;j.parts.forEach((n,i)=>{const isMachine=/\.(gcode|gx|3mf)$/i.test(n);if(isMachine)machine++;else geometry++;const row=document.createElement('div');row.className='part';const tag=document.createElement('span');tag.className='tag '+(isMachine?'ready':'blocked');tag.textContent=isMachine?'MACHINE FILE':'SLICING REQUIRED';const name=document.createElement('span');name.textContent=(i+1)+'. '+n;row.append(name,tag);parts.appendChild(row)});status.textContent='Inspection complete. '+geometry+' geometry file(s) require slicing; '+machine+' machine-ready file(s).\nNo simulated Prepare-to-Print or fake Open-in-3D actions are shown.'}catch(e){status.textContent='FAILED — '+e.message}};
</script></body></html>
