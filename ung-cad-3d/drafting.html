<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UNG-CAD 2D</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,-apple-system,sans-serif;background:#243986;color:#fff}.app{display:grid;grid-template-columns:220px 1fr;height:100vh}.bar{background:#2e4596;padding:12px;border-right:1px solid rgba(255,255,255,.25);overflow:auto}.bar h1{font-size:20px;margin:0 0 8px}.home{display:block;background:#fff;color:#27408c;text-decoration:none;text-align:center;padding:6px;margin-bottom:10px}.bar button,.bar input{width:100%;margin:3px 0;padding:7px;border:1px solid #a7b2dc;background:#fff;color:#263b82}.bar button.active{background:#59d6e7;font-weight:bold}.canvasWrap{background:#f6f7fb;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%;background:white}.label{font-size:11px;margin-top:8px;color:#d8e0ff}.status{font-size:11px;margin-top:10px;color:#cfe8ff;white-space:pre-wrap}@media(max-width:700px){.app{grid-template-columns:1fr;grid-template-rows:auto 65vh}.bar{border-right:0;border-bottom:1px solid rgba(255,255,255,.25)}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.bar button{min-height:38px}}</style></head><body><div class="app"><aside class="bar"><h1>UNG-CAD 2D</h1><a class="home" href="/">← Home</a><div class="tools"><button class="tool active" data-tool="line">Line / Wall</button><button class="tool" data-tool="rect">Rectangle</button><button class="tool" data-tool="circle">Circle</button><button class="tool" data-tool="label">Label</button><button class="tool" data-tool="dimension">Dimension</button><button class="tool" data-tool="select">Select / Delete</button></div><div class="label">Drawing name</div><input id="drawing-name" value="Untitled"><div class="label">Grid size (px)</div><input id="grid-size" type="number" value="20"><div class="label">Scale units / px</div><input id="scale" type="number" value="0.05" step="0.01"><button id="save">Save locally</button><button id="export">Export SVG</button><div id="status" class="status">Ready.</div></aside><main class="canvasWrap" id="wrap"><canvas id="canvas"></canvas></main></div><script src="/static/drafting.js"></script></body></html>
