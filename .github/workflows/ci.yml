name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/unified-control-plane

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; elif [ -f pyproject.toml ]; then pip install -e '.[test]'; fi
          pip install pytest pytest-asyncio
      - name: Import smoke test
        run: python -c "from app.main import app; print(app.title)"
      - name: Run tests
        run: pytest -q
